<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9edbff">
  <meta name="color-scheme" content="light">
  <title>HanzuVPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="loader" class="loader-screen">
    <div class="loader-glow"></div>
    <img src="logo.png" class="loader-logo" alt="HANZU">
    <div class="loader-name">HANZU</div>
    <div class="loader-signature">hanzu</div>
    <div class="loader-ring"></div>
    <div class="loader-text">در حال بارگذاری...</div>
    <div class="loader-sub">FAST • SECURE • GLOBAL</div>
  </div>

  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>
  <main class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="HanzuVPN" class="brand-logo">
        <div><strong>HanzuVPN</strong><span id="hello">پنل کاربری</span></div>
      </div>
      <button class="icon-btn" id="refresh" aria-label="بروزرسانی">↻</button>
    </header>

    <section class="hero glass">
      <div>
        <span class="eyebrow">موجودی کیف پول</span>
        <div class="balance" id="balance">۰ تومان</div>
        <small id="tg-user">کاربر HanzuVPN</small>
      </div>
      <button class="primary" data-action="wallet">＋ شارژ کیف پول</button>
    </section>

    <section class="section" data-section="home">
      <div class="section-head"><h2>خرید اشتراک</h2><span>۳۰ روزه</span></div>
      <div class="plans" id="plans"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>دسترسی سریع</h2></div>
      <div class="quick-grid">
        <button class="quick glass" data-action="services"><span>📊</span><b>سرویس‌های من</b><small>مدیریت و تمدید</small></button>
        <button class="quick glass" data-action="wallet"><span>💰</span><b>کیف پول</b><small>موجودی و تراکنش‌ها</small></button>
        <button class="quick glass" data-action="help"><span>📚</span><b>آموزش اتصال</b><small>Android / iPhone / Windows</small></button>
        <button class="quick glass" data-action="support"><span>👨🏻‍💻</span><b>پشتیبانی</b><small>@ByHxnzu</small></button>
      </div>
    </section>

    <section class="section" id="services-panel">
      <div class="section-head"><h2>سرویس‌های من</h2><button class="link-btn" data-action="services">مشاهده همه</button></div>
      <div class="service glass" id="service">
        <div class="service-icon">⌁</div>
        <div><strong>هنوز سرویسی ندارید</strong><p>بعد از خرید، سرویس‌های فعال اینجا نمایش داده می‌شوند.</p></div>
      </div>
    </section>

    <section class="section info-section" id="help-panel">
      <div class="section-head"><h2>راهنمای اتصال</h2></div>
      <div class="os-grid">
        <button class="os-card glass" data-action="android"><span>🤖</span><b>Android</b><small>Hiddify • V2Box • v2rayNG</small></button>
        <button class="os-card glass" data-action="ios"><span></span><b>iPhone / iOS</b><small>Hiddify • V2Box • Streisand</small></button>
        <button class="os-card glass" data-action="windows"><span>▣</span><b>Windows</b><small>Hiddify • v2rayN</small></button>
      </div>
    </section>

    <nav class="bottom glass" aria-label="منوی اصلی">
      <button class="nav active" data-page="home"><span>⌂</span><small>خانه</small></button>
      <button class="nav" data-page="services"><span>◈</span><small>سرویس‌ها</small></button>
      <button class="nav" data-page="wallet"><span>◉</span><small>کیف پول</small></button>
      <button class="nav" data-page="help"><span>?</span><small>آموزش</small></button>
    </nav>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
