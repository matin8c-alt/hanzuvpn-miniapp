<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حنزو وی‌پی‌ان | Hanzu VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="ios-header">
        <div class="header-title">حنزو وی‌پی‌ان ⚡️</div>
        <div class="user-status-badge" id="userStatus">اشتراک فعال</div>
    </header>

    <main class="ios-content">
        
        <section class="ios-card subscription-card">
            <div class="card-icon">🛡️</div>
            <div class="card-info">
                <h3>وضعیت حساب شما</h3>
                <p id="daysRemaining">در حال بارگذاری اطلاعات...</p>
            </div>
        </section>

        <h2 class="section-title">خرید اشتراک جدید</h2>
        <div class="plans-container" id="plansContainer">
            <div class="ios-card plan-card" onclick="selectPlan('1')">
                <div class="plan-header">
                    <span class="plan-name">اشتراک ۱ ماهه</span>
                    <span class="plan-price">۱۹۹,۰۰۰ تومان</span>
                </div>
                <p class="plan-desc">حجم ۳۰ گیگابایت - سرعت نامحدود</p>
            </div>
            <div class="ios-card plan-card popular" onclick="selectPlan('3')">
                <div class="badge-popular">پیشنهاد ویژه</div>
                <div class="plan-header">
                    <span class="plan-name">اشتراک ۳ ماهه</span>
                    <span class="plan-price">۴۹۹,۰۰۰ تومان</span>
                </div>
                <p class="plan-desc">حجم ۱۰۰ گیگابایت - پرسرعت‌ترین سرورها</p>
            </div>
        </div>

        <div class="action-container">
            <button class="ios-button primary" onclick="handlePurchase()">پرداخت و دریافت کانفیگ</button>
        </div>

    </main>

    <nav class="ios-tabbar">
        <div class="tab-item active" onclick="switchTab(this, 'home')">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">خانه</span>
        </div>
        <div class="tab-item" onclick="switchTab(this, 'configs')">
            <span class="tab-item-icon">⚙️</span>
            <span class="tab-label">اشتراک‌ها</span>
        </div>
        <div class="tab-item" onclick="switchTab(this, 'support')">
            <span class="tab-item-icon">💬</span>
            <span class="tab-label">پشتیبانی</span>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
